# Facts the paper states that are missing from experiments/gold/next_white.yaml and experiments/gold_relations/next_white.yaml.
# Cross-check by Claude, 2026-10-12, from reading sections 3 to 8.3 (pages 5 to 23) of the text in runs/papers20/next_white/step1;
# sections 1, 2 and 8.4 to 10 only scanned for sizes. Not merged into the hand lists. Not checked by a detector expert.
# p: page of the PDF.
# detector: NEXT-White (NEW)
values:
- {value: 15, key: "pressure|bar", what: "nominal xenon pressure (bar); the vessel is certified for 20", p: 6}
- {value: 31, key: "coverage|pmt|photocathode", what: "photocathode coverage of the energy plane (%)", p: 5}
- {value: 3, key: "ring|rectang|copper", what: "short side of the copper ring cross-section, 10 mm x 3 mm (mm)", p: 6}
- {value: 0.5, key: "ring|edge|radius", what: "edge radius of the copper ring cross-section (mm)", p: 6}
- {value: 1.8, key: "ring|pitch", what: "pitch of the copper rings as printed (mm); smaller than the 3 mm ring, so likely the gap or a misprint", p: 6, optional: true}
- {value: 3, key: "pmt|cent", what: "PMTs in the centre, the other 9 in a ring around them", p: 10}
- {value: 8, key: "tracking|sipm|el|centre|center", what: "distance of the tracking plane from the centre of the electroluminescence region (mm)", p: 14}
- {value: 28, key: "board|dice", what: "SiPM boards (DICE boards)", p: 15}
- {value: 64, alt: 8, key: "board|dice|sipm|pixel", what: "SiPMs per board, 8 x 8", p: 15}
- {value: 6, key: "feedthrough|fr4|pcb", what: "thickness of the FR4 feedthrough board (mm), 3 copper layers", p: 15}
- {value: 2, key: "feedthrough|hvft", what: "high voltage feedthroughs, one for the cathode and one for the gate", p: 9}
- {value: 225, key: "volume|pressure system", what: "volume of the pressure system (L): vessel 140, gas loop 45, compressor 45", p: 20}
- {value: 3, key: "getter", what: "getters in the gas loop: two cold, one hot", p: 21}
- {value: 2, key: "bottle", what: "cryo-recovery bottles (69 L and 61 L)", p: 22}
- {value: 2.3, key: "tank|expansion", what: "volume of the expansion tank (m3)", p: 23}
- {value: 20, key: "wall|uniform|radial", what: "the field is uniform up to this distance from the walls (mm)", p: 7, optional: true}
materials:
