- {part: "high voltage feedthroughs", material: "HDPE in a radiopure stainless steel piece", p: 10}
- {part: "shield around the vessel", material: "lead (the lead castle)", p: 6}
- {part: "gas", material: "xenon at high pressure", p: 5}
