- {part: "inner shield shell and the plates carrying both planes", material: "ultra-pure copper", p: 5}
- {part: "field cage body", material: "high density polyethylene (HDPE), cylindrical shell, grooved", p: 6}
- {part: "field rings", material: "radiopure copper", p: 6}
- {part: "cathode and gate", material: "transparent steel grids on radiopure steel frames", p: 6}
- {part: "anode", material: "fused silica plate coated with ITO, with TPB on top", p: 8}
- {part: "light tube", material: "teflon rings coated with TPB", p: 10}
