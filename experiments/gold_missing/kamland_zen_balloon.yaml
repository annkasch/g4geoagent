- {value: 2, key: "layer|belt", what: "film layers of a belt", p: 17}
- {value: 2, key: "o-ring", what: "O-rings per corrugated tube connection", p: 19}
- {value: 2, key: "camera", what: "monitoring cameras", p: 19, optional: true}
materials:
- {part: "inner balloon film, belts, polar harness, guide tubes", material: "Nylon-6, single layer, made without filler", p: 9}
- {part: "outer balloon film", material: "five-layer nylon/EVOH", p: 4}
- {part: "KamLAND tank", material: "stainless steel, spherical", p: 4}
- {part: "corrugated tube", material: "hard nylon (PMA CYLG-95B)", p: 7}
- {part: "connection cylinders, film holders, string guide", material: "PEEK", p: 8}
- {part: "O-rings of the tube connections", material: "fluoro-rubber", p: 8}
- {part: "strings", material: "Vectran", p: 6}
- {part: "KamLAND scintillator", material: "20 % pseudocumene, 80 % dodecane, 1.36 g/L PPO", p: 6}
- {part: "xenon-loaded scintillator", material: "18 % pseudocumene, 82 % decane, 2.38 g/L PPO, with xenon enriched to 90.9 % in 136Xe", p: 6}
- {part: "between outer balloon and tank", material: "buffer oil", p: 4}
- {part: "inner balloon shape", material: "teardrop", p: 6}
