- {subject: "balloon|(?<![a-z])ib(?![a-z])", object: "chimney", family: any, what: "the inner balloon is suspended from the chimney at the top of the detector", p: 6}
- {subject: "kamland|detector|outer|(?<![a-z])ob(?![a-z])", object: "inner|(?<![a-z])ib(?![a-z])", family: nest, what: "the inner balloon is at the centre of the detector, inside the outer balloon", p: 4}
