# Relations between parts that the paper states, listed by hand (Claude, 2026-10-10; not checked by a detector expert).
# subject / object: a word that must appear in the name or another name of the part (regular expression).
# family: nest = the object is within the subject (contains, encloses, surrounds, consists of);
#         attach = mounted on or attached to, either way round; place = the named relation exactly;
#         any = any relation between the two, either way round.

- {subject: "tank", object: "water", family: nest, what: "the tank holds the water"}
- {subject: "tank", object: "framework|structure", family: nest, what: "the framework is within the tank"}
- {subject: "framework|structure", object: "pmt|photomultiplier", family: any, what: "the framework supports the PMT arrays"}
- {subject: "plate|shift", object: "pmt|photomultiplier", family: any, what: "each outer PMT is attached to a wavelength-shifting plate"}
- {subject: "hatch", object: "tank", family: any, what: "hatches are on the tank top"}
- {subject: "hut", object: "tank", family: any, what: "the electronics huts are on the tank top"}
- {subject: "tyvek|reflect", object: "od|outer", family: any, what: "the outer detector is lined with Tyvek"}
