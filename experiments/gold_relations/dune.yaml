# Relations between parts that the paper states, listed by hand (Claude, 2026-10-10; not checked by a detector expert).
# subject / object: a word that must appear in the name or another name of the part (regular expression).
# family: nest = the object is within the subject (contains, encloses, surrounds, consists of);
#         attach = mounted on or attached to, either way round; place = the named relation exactly;
#         any = any relation between the two, either way round.

- {subject: "nd_lar|lartpc|liquid", object: "module", family: nest, what: "ND-LAr is a 7 x 5 array of modules"}
- {subject: "module", object: "tpc", family: nest, what: "each module contains two TPCs"}
- {subject: "ecal|calorimeter", object: "tpc|gar", family: nest, what: "the calorimeter surrounds the gas TPC"}
- {subject: "magnet|solenoid", object: "tpc|ecal|calorimeter|gar", family: nest, what: "TPC and calorimeter are within the magnet"}
- {subject: "near|nd$|suite|hall", object: "lar", family: nest, what: "the near detector includes ND-LAr"}
- {subject: "near|nd$|suite|hall", object: "gar", family: nest, what: "the near detector includes ND-GAr"}
- {subject: "near|nd$|suite|hall", object: "sand", family: nest, what: "the near detector includes SAND"}
- {subject: "sand", object: "tracker|calorimeter|ecal", family: nest, what: "SAND has a tracker and a calorimeter"}
- {subject: "gar", object: "lar", family: any, what: "ND-GAr is immediately downstream of ND-LAr"}
