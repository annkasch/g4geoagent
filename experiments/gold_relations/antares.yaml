- {subject: "emc|cable", object: "storey|omf", family: any, what: "electro-mechanical cable segments link the storeys"}
- {subject: "seabed", object: "line", family: any, what: "the lines are arranged on the seabed in an octagonal configuration"}
- {subject: "(?<![a-z])(om)s?(?![a-z])|optical|sphere", object: "wire|plate|support", family: any, what: "titanium wires pull the optical module onto its support plate"}
