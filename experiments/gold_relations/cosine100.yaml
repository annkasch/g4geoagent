# Relations between parts that the paper states, listed by hand (Claude, 2026-10-12; from sentences picked by a
# program, written before any reader ran on this paper; every entry checked against its sentence in the paper on 2026-10-12; not checked by a detector expert).
# family: nest = the object is within the subject; attach = mounted on or attached to, either way round;
#         any = any relation between the two, either way round; otherwise the named relation exactly.
# detector: COSINE-100
- {subject: "copper|tube|encapsul", object: "crystal|(?<![a-z])nais?(?![a-z])", family: nest, what: "the crystals are encased in copper tubes"}
- {subject: "ptfe|reflect", object: "crystal|(?<![a-z])nais?(?![a-z])", family: any, what: "the crystals are wrapped in PTFE sheets"}
- {subject: "quartz|window", object: "crystal|(?<![a-z])nais?(?![a-z])|tube", family: any, what: "quartz windows close each end of the crystal"}
- {subject: "lead", object: "copper|box", family: any, what: "the lead shield is outside the copper box"}
- {subject: "copper|box", object: "scintillator|(?<![a-z])lss?(?![a-z])|liquid", family: any, what: "going inward, the copper box is followed by the scintillating liquid"}
- {subject: "plastic|panel", object: "lead|shield", family: any, what: "plastic scintillator panels are the outermost layer"}
- {subject: "liquid|scintillator|(?<![a-z])(ls)s?(?![a-z])", object: "crystal|(?<![a-z])(nai)s?(?![a-z])|assembl", family: nest, what: "the crystal assemblies are immersed in the scintillating liquid"}
- {subject: "pad|window|quartz", object: "pmt|photomult", family: any, what: "the optical pads and windows are coupled to PMTs"}
- {subject: "housing", object: "pmt|photomult", family: any, what: "the PMTs are protected by a housing of copper and PTFE"}
