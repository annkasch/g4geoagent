# Relations between parts that the paper states, listed by hand (Claude, 2026-10-12; from sentences picked by a
# program, written before any reader ran on this paper; not checked by a detector expert).
# family: nest = the object is within the subject; attach = mounted on or attached to, either way round;
#         any = any relation between the two, either way round; otherwise the named relation exactly.
# detector: JUNO (with its satellite detectors TAO and OSIRIS)
- {subject: "acrylic|vessel|av", object: "ls|scintillator", family: nest, what: "the acrylic vessel contains the liquid scintillator"}
- {subject: "copper|shell", object: "acrylic|vessel", family: any, what: "a copper shell wraps the acrylic vessel"}
- {subject: "tank|steel", object: "copper|shell", family: any, what: "the copper shell is installed in a steel tank"}
- {subject: "water", object: "cd|central|detector", family: any, what: "the central detector is surrounded by water tanks"}
- {subject: "tank|steel|water", object: "av|acrylic|vessel", family: any, what: "the acrylic vessel is mounted inside a water-filled steel tank"}
