# Relations between parts that the paper states, listed by hand (Claude, 2026-10-12; from sentences picked by a
# program, written before any reader ran on this paper; not checked by a detector expert).
# family: nest = the object is within the subject; attach = mounted on or attached to, either way round;
#         any = any relation between the two, either way round; otherwise the named relation exactly.
# detector: NEXT-White (NEW)
- {subject: "copper|ics|shell", object: "vessel|tpc|barrel", family: any, what: "a copper shell shields the barrel region"}
- {subject: "tpc", object: "drift|buffer|region", family: nest, what: "the TPC has drift, buffer and electroluminescent regions"}
- {subject: "tracking|plane|dice|board", object: "copper|plate", family: any, what: "the tracking plane is supported by a copper plate"}
- {subject: "energy|pmt", object: "copper|plate", family: any, what: "the energy plane is supported by a copper plate"}
- {subject: "anode", object: "plate|silica", family: any, what: "the anode is a coated fused-silica plate"}
