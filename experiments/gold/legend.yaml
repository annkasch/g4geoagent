# Construction values listed by hand (Claude, 2026-10-09; not checked by a detector expert).
# value: the number (alt: another way it is written). key: a word that must appear in the claim.
# optional: fine to extract, fine to leave out.
- {value: 10, key: "tank|water", what: water tank diameter (m)}
- {value: 8, key: "tank|water", what: water tank height (m)}
- {value: 590, key: "water|tank", what: water volume (m3)}
- {value: 66, key: "pmt|photo", what: number of PMTs}
- {value: 4, key: "cryostat", what: cryostat diameter (m)}
- {value: 64, key: "argon|lar|cryostat", what: liquid argon volume (m3)}
