- {value: 2, key: "shroud|fiber|fibre", what: two fiber shrouds}
- {value: 12, key: "string", what: number of strings}
- {value: 200, key: "kg|germanium|detector|array", what: detector mass}
- {value: 90, key: "enrich|76ge|ge", what: enrichment (percent)}
