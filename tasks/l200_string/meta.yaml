id: l200_string
title: LEGEND-200 with one detector string, liquid-argon veto, cryostat and water tank
ladder_level: 7
phase: 2                      # no complete description exists; the reference is public code

docs: []                      # not written yet: the agent's documents for this task
reference:
  gdml: reference/reference.gdml
  make: reference/make_reference.py      # runs legend-pygeom-l200 0.12.0, from env_l200/
  config: reference/config.yaml
  report: reference/geant4_report.json   # Geant4 load, overlap check and parts list
  pictures: [reference/reference_overview.png, reference/reference_cryostat.png,
             reference/reference_string.png]

source: >
  Generated unchanged by the public LEGEND-200 geometry package legend-pygeom-l200
  (GPL-3.0) with its public dummy detector data. The only change is the channel map,
  reduced to detector string 1.

features: [many_volumes, several_subsystems, deep_nesting, repeated_placement,
           meshes, thin_layers, large_scale_range]

contents:                     # 1052 volumes in total
  germanium_detectors: 8      # inverted coax, all with the same public dummy shape, 1246 g each
  detector_units: 8           # PEN baseplate, insulators, clamps, pins, cables per detector
  copper_rods: 3
  mini_shroud: 1              # nylon tube with lid around the string
  fiber_modules: 49           # liquid-argon veto: 9 inner and 40 outer, coarse "segmented" model
  sipms: 58
  cryostat: 1                 # steel walls with vacuum gap, liquid and gaseous argon
  water_tank: 1
  pmts: 63                    # 53 working and 10 marked broken

masses_kg:
  water: 584535
  liquid_argon: 86965
  steel_tank: 27179
  steel_cryostat: 22697
  copper: 40.7
  germanium: 9.97

notes:
  - The detectors are the package's public dummy detectors, not P43511A.
  - A string shortened below its full 8 detectors makes the mini-shroud overlap an
    electronics board, because the package places them for the full string. The
    full string has no overlaps.
  - Left out, to keep the task small: the other detector strings, the calibration
    system and the wavelength-shifting reflector.
  - Fibers use the package's coarse model (one volume per module, not single fibers).
